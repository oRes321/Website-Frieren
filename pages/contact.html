<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Форма для зв'язку з творцями фанатського сайту про Фрірен.">
    <title>Контакти | Фрірен</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/responsive.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <span class="logo-text">Фрірен's Journey</span>
            </div>
            
            <button class="menu-toggle" aria-label="Меню" aria-expanded="false">☰</button>
            
            <nav>
                <ul class="nav-list">
                    <li><a href="../index.html">Головна</a></li>
                    <li><a href="about.html">Про Фрірен</a></li>
                    <li><a href="contact.html" class="active">Контакти</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                </ul>
            </nav>
            
            <button class="theme-switch" aria-label="Змінити тему">🌙</button>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>📬 Зв'яжіться з нами</h1>
            
            <div class="section">
                <p>Маєте питання щодо сайту або хочете поділитися своєю любов'ю до аніме? Заповніть форму нижче!</p>
            </div>
            
            <div class="form-card">
                <h2>📝 Форма зворотного зв'язку</h2>
                
                <div id="draftIndicator" style="font-size: 0.875rem; margin-bottom: 1rem;"></div>
                <div id="formError" style="font-size: 0.875rem; margin-bottom: 1rem;"></div>
                
                <form id="contact-form">
                    <div class="form-group">
                        <label for="name">Ваше ім'я <span class="required">*</span></label>
                        <input type="text" id="name" name="name" required minlength="2" maxlength="50" placeholder="Наприклад, Фрірен">
                        <span id="nameError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="frieren@example.com">
                        <span id="emailError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Номер телефону</label>
                        <input type="tel" id="phone" name="phone" placeholder="+380 99 123 45 67">
                    </div>
                    
                    <div class="form-group">
                        <label for="topic">Тема звернення</label>
                        <select id="topic" name="topic">
                            <option value="feedback">Відгук про сайт</option>
                            <option value="question">Питання про аніме</option>
                            <option value="coop">Співпраця</option>
                            <option value="other">Інше</option>
                        </select>
                    </div>
                    
                    <fieldset>
                        <legend>Зручний спосіб зв'язку</legend>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="contactWay" value="email" checked> Email
                            </label>
                            <label>
                                <input type="radio" name="contactWay" value="phone"> Телефон
                            </label>
                        </div>
                    </fieldset>
                    
                    <div class="form-group">
                        <label for="message">Ваше повідомлення <span class="required">*</span></label>
                        <textarea id="message" name="message" rows="5" maxlength="500" placeholder="Напишіть, яка серія вам сподобалась найбільше..."></textarea>
                        <span id="charCounter"></span>
                        <span id="messageError"></span>
                    </div>
                    
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" name="agree" required> Я погоджуюсь з правилами обробки даних (вигаданими).
                        </label>
                    </div>
                    
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">📨 Надіслати повідомлення</button>
                        <button type="button" id="clearDraftBtn" class="btn btn-secondary">🗑️ Очистити чернетку</button>
                    </div>
                </form>
                
                <div id="formResult" style="display: none; margin-top: 2rem;"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span class="current-year">2026</span> Студент ІП-23. Всі права захищено.</p>
        </div>
    </footer>
    
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <img id="modalImage" src="" alt="Збільшене зображення">
        </div>
    </div>
    
    <button class="back-to-top" aria-label="Вгору">↑</button>
    
    <script src="../js/main.js" defer></script>
    <script src="../js/contact.js" defer></script>
</body>
</html>
